apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: client-vite-gateway
  namespace: business
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Fara oauth2-proxy gate: e o SPA cu login propriu (keycloak-js), Home trebuie
    # sa fie public. Aprobarea pe grup (/users, /admins) se verifica acum in
    # backend (data-service/importer SecurityConfig), nu la nivel de Ingress.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.icode.mywire.org
      secretName: client-vite-gw-tls-cert
  rules:
    - host: app.icode.mywire.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-proxy
                port:
                  number: 80
