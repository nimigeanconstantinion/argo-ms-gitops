apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: business
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Fara oauth2-proxy gate: verifica doar cookie de sesiune, nu header-ul
    # Authorization: Bearer trimis de SPA — interceptarea aici rupea orice
    # fetch() cu JWT valid. Validarea JWT + gate-ul pe grup se fac in backend.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.icode.mywire.org
      secretName: api-gw-tls-cert
  rules:
    - host: api.icode.mywire.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-proxy
                port:
                  number: 80
