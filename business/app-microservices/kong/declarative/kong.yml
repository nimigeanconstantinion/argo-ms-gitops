_format_version: "3.0"

upstreams:
  - name: data-service-upstream
    targets:
      - target: data-service.business.svc:8081
        weight: 100
  - name: importer-service-upstream
    targets:
      - target: importer-service.business.svc:8082
        weight: 100
  - name: client-vite-upstream
    targets:
      - target: client-vite.business.svc:80
        weight: 100

services:
  - name: data-service
    host: data-service-upstream
    port: 8081
    protocol: http
    routes:
      - name: data-service                 # existing — unchanged
        hosts:
          - data-service.icode.mywire.org
      - name: api-command-route            # new: api.icode.mywire.org/api/v1/command/* -> data-service
        hosts:
          - api.icode.mywire.org
        paths:
          - /api/v1/command
        strip_path: false
  - name: importer-service
    host: importer-service-upstream
    port: 8082
    protocol: http
    routes:
      - name: importer-service             # existing — unchanged
        hosts:
          - importer-service.icode.mywire.org
      - name: api-query-route              # new: api.icode.mywire.org/api/v1/query -> importer-service
        hosts:
          - api.icode.mywire.org
        paths:
          - /api/v1/query
        strip_path: false
  - name: client-vite
    host: client-vite-upstream
    port: 80
    protocol: http
    # preserve_host: fara asta Kong trimite Host=client-vite.business.svc (numele
    # intern al upstream-ului) catre pod. nginx-ul din container construieste
    # redirectul "/ -> /ui/" ca URL absolut pe baza acelui Host, deci browserul
    # ajunge pe un hostname intern nerezolvabil in loc de app.icode.mywire.org.
    preserve_host: true
    routes:
      - name: client-vite
        hosts:
          - app.icode.mywire.org