apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: client-vite
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://github.com/nimigeanconstantinion/argo-ms-gitops.git
      targetRevision: master
      path: business/charts/api-ms
      helm:
        releaseName: client-vite
        valueFiles:
          - $values/business/app-microservices/client-vite/values.yaml

    - repoURL: https://github.com/nimigeanconstantinion/argo-ms-gitops.git
      targetRevision: master
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: business

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
