apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: default
  namespace: monitoring
  labels:
    alertmanagerConfig: default
spec:
  timeIntervals:
    - name: ore-de-lucru
      timeIntervals:
        - times:
            - startTime: "08:00"
              endTime: "17:00"
          weekdays: ["monday:friday"]

  route:
    receiver: slack
    groupBy: ["alertname", "namespace"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      - matchers:
          - name: alertname
            value: CPUTemperatureHigh
        receiver: slack
        groupWait: 0s
        repeatInterval: 10m # Aici se definește ruta și periodicitatea de 10 min
        activeTimeIntervals:
          - ore-de-lucru

  receivers:
    - name: slack
      slackConfigs:
        - apiURL:
            name: slack-webhook
            key: url
          title: '{{ template "slack.default.title" . }}'
          text: |-
            {{ range .Alerts }}
            *Alertă:* {{ .Annotations.summary }}
            *Detalii:* {{ .Annotations.description }}
            {{ end }}
          sendResolved: true